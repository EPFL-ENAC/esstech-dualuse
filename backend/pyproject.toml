[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for esstech-dualuse"
readme = "README.md"
requires-python = ">=3.10,<3.14"

dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "dualuse",
    "fastapi>=0.128.0",
    "fastapi-cache2>=0.2.2",
    "jinja2>=3.1.6",
    "openai>=2.41.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.21",
    "sqlalchemy[asyncio]>=2.0.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.22.1",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv[cli]>=1.2.1",
]

[tool.setuptools]
packages = ["api"]

[tool.codespell]
skip = 'uv.lock'

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "package/tests"]

[tool.uv.workspace]
members = [
    "package",
]

[tool.uv.sources]
dualuse = { workspace = true }
