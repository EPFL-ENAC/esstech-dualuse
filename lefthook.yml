#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    # The "{,**/}" in these globs matches src's own files as well as its
    # subdirectories: a bare "**/" requires at least one directory, which
    # silently skipped src/App.vue and src/env.d.ts.
    frontend-typecheck:
      root: frontend
      glob: "frontend/src/{,**/}*.{ts,vue}"
      exclude: "frontend/third-party/**"
      run: test -f .quasar/tsconfig.json || npx quasar prepare && npx vue-tsc --noEmit --project tsconfig.typecheck.json
    frontend-lint:
      root: frontend
      glob: "frontend/src/{,**/}*.{ts,js,cjs,mjs,vue}"
      exclude: "frontend/third-party/**"
      run: test -f .quasar/tsconfig.json || npx quasar prepare && npx eslint -c eslint.config.js {staged_files}
    frontend-format:
      root: frontend
      glob: "frontend/src/{,**/}*.{js,ts,vue,scss,html,md,json}"
      exclude: "frontend/third-party/**"
      run: npx prettier --write {staged_files} --ignore-path .gitignore
      stage_fixed: true
    # The "{,**/}" in these globs matches a directory's own files as well as
    # its subdirectories: a bare "**/" requires at least one directory, which
    # silently skipped api/db.py, api/main.py and every tests/ file.
    backend-typecheck:
      root: backend
      glob: "backend/{api,tests,scripts}/{,**/}*.py"
      # Alembic generates migrations/ and owns their formatting; linting them
      # would fight the generator on every new revision.
      exclude: "backend/migrations/**"
      run: uvx ty@0.0.37 check {staged_files}
    backend-lint:
      root: backend
      glob: "backend/{api,tests,scripts}/{,**/}*.py"
      # Alembic generates migrations/ and owns their formatting; linting them
      # would fight the generator on every new revision.
      exclude: "backend/migrations/**"
      run: uvx ruff@0.15.13 check --fix --select I {staged_files}
      stage_fixed: true
    backend-format:
      root: backend
      glob: "backend/{api,tests,scripts}/{,**/}*.py"
      # Alembic generates migrations/ and owns their formatting; linting them
      # would fight the generator on every new revision.
      exclude: "backend/migrations/**"
      run: uvx ruff@0.15.13 format {staged_files}
      stage_fixed: true
    codespell:
      run: uvx codespell@2.4.2 --skip="frontend/package-lock.json" {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx --yes -p "@commitlint/cli@21.0.1" -p "@commitlint/config-conventional@21.0.1" -- commitlint --edit {1}
