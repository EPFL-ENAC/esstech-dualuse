pre-commit:
  parallel: true
  commands:
    # "{,**/}" matches src's own files as well as its subdirectories: a bare
    # "**/" requires at least one directory (it skipped src/App.vue).
    frontend-typecheck:
      root: frontend
      glob:
        - "frontend/src/{,**/}*.{ts,vue}"
        - "frontend/e2e/{,**/}*.ts"
        - "frontend/playwright.config.ts"
      run: test -f .quasar/tsconfig.json || npx quasar prepare && npx vue-tsc --noEmit --project tsconfig.json
    frontend-lint:
      root: frontend
      glob:
        - "frontend/src/{,**/}*.{ts,js,cjs,mjs,vue}"
        - "frontend/e2e/{,**/}*.{ts,js,cjs,mjs,vue}"
        - "frontend/playwright.config.ts"
      run: test -f .quasar/tsconfig.json || npx quasar prepare && npx eslint -c eslint.config.js {staged_files}
    frontend-format:
      root: frontend
      glob:
        - "frontend/src/{,**/}*.{js,ts,vue,scss,html,md,json}"
        - "frontend/e2e/{,**/}*.{js,ts,vue,scss,html,md,json}"
        - "frontend/playwright.config.ts"
      run: npx prettier --write {staged_files} --ignore-path .gitignore
      stage_fixed: true
    # "{,**/}": see the frontend globs above.
    backend-typecheck:
      root: backend
      glob: "backend/{api,tests,scripts}/{,**/}*.py"
      # Alembic generates migrations/ and owns their formatting; linting them
      # would fight the generator on every new revision.
      exclude: "backend/migrations/**"
      run: uvx ty@0.0.37 check {staged_files}
    backend-lint:
      root: backend
      glob: "backend/{api,tests,scripts}/{,**/}*.py"
      # Alembic generates migrations/ and owns their formatting; linting them
      # would fight the generator on every new revision.
      exclude: "backend/migrations/**"
      run: uvx ruff@0.15.13 check --fix --select I {staged_files}
      stage_fixed: true
    backend-format:
      root: backend
      glob: "backend/{api,tests,scripts}/{,**/}*.py"
      # Alembic generates migrations/ and owns their formatting; linting them
      # would fight the generator on every new revision.
      exclude: "backend/migrations/**"
      run: uvx ruff@0.15.13 format {staged_files}
      stage_fixed: true
    codespell:
      # portait, constitue, fonction, correspondance, comparaison, projet,
      # combinaison, limite, espace, explicite: French ("was carrying/holding",
      # imperfect of porter; "constitutes"; "function"; "match/correspondence";
      # "comparison"; "project"; "combination"; "limit"; "space"; "explicit")
      # -- codespell has no French dictionary.
      # fase: Italian ("phase"), used verbatim in code comments citing the
      # flow spec's own section numbering (e.g. "Fase 6") -- not a typo of
      # "phase".
      run: uvx codespell@2.4.2 --skip="frontend/package-lock.json" --ignore-words-list="portait,constitue,fase,fonction,correspondance,comparaison,projet,combinaison,limite,espace,explicite" {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx --yes -p "@commitlint/cli@21.0.1" -p "@commitlint/config-conventional@21.0.1" -- commitlint --edit {1}
